[package]
name = "vertex-swarm-net-swap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "SWAP protocol for Swarm bandwidth accounting with cheque settlement"

[lints]
workspace = true

[dependencies]
## vertex
vertex-net-codec.workspace = true
vertex-swarm-net-headers.workspace = true
vertex-swarm-net-proto.workspace = true
vertex-swarm-accounting-chequebook.workspace = true

## async
futures.workspace = true

## p2p
asynchronous-codec.workspace = true
quick-protobuf.workspace = true
quick-protobuf-codec.workspace = true
libp2p.workspace = true

## crypto
alloy-primitives.workspace = true

## misc
bytes.workspace = true
strum.workspace = true
thiserror.workspace = true
# serde_json: sanctioned for the swap cheque wire (transport-only JSON), per
# crates/swarm/AGENTS.md. Not for any internal or public API surface.
serde_json.workspace = true

## tracing
tracing.workspace = true

## test-value generation (feature `arbitrary`)
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
vertex-swarm-test-utils.workspace = true
arbitrary = { workspace = true }
proptest = { workspace = true }
proptest-arbitrary-interop = { workspace = true }

[features]
# Valid-by-construction `Arbitrary` impls for the swap messages plus the
# fuzz-facing surface (the raw decode entry points, cheque payload path
# included), shared by the proptest suite and the fuzz targets. Dev-only:
# never enabled by a shipped artefact cone, and only ever pulled inside the
# swap cone / fuzz workspace.
arbitrary = ["dep:arbitrary"]

[package]
name = "vertex-swarm-net-pushsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Swarm pushsync protocol for chunk push/receipt"

[dependencies]
## vertex
vertex-net-codec.workspace = true
vertex-swarm-net-headers.workspace = true
vertex-swarm-net-proto.workspace = true
vertex-swarm-primitives.workspace = true
nectar-primitives.workspace = true
nectar-postage.workspace = true

## alloy
# `alloy-signer` pulls the `k256` feature on `alloy-primitives` so a custody
# receipt's signer can be recovered from its signature at the decode boundary.
alloy-primitives.workspace = true
alloy-signer.workspace = true

## p2p
libp2p.workspace = true
asynchronous-codec.workspace = true

## protobuf
quick-protobuf.workspace = true
quick-protobuf-codec.workspace = true

## async
futures.workspace = true

## misc
bytes.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true

## test-value generation (feature `arbitrary`)
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# Receipt recovery tests sign real custody receipts.
alloy-signer-local.workspace = true
arbitrary = { workspace = true }
proptest = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
nectar-primitives = { workspace = true, features = ["arbitrary"] }
nectar-postage = { workspace = true, features = ["arbitrary"] }
vertex-swarm-primitives = { workspace = true, features = ["arbitrary"] }

[features]
# Valid-by-construction `Arbitrary` impls for the wire types, shared by the
# proptest suite and the fuzz round-trip target. Dev-only: never enabled by
# a shipped artefact cone.
arbitrary = [
    "dep:arbitrary",
    "nectar-primitives/arbitrary",
    "nectar-postage/arbitrary",
    "vertex-swarm-primitives/arbitrary",
]

[lints]
workspace = true

[package]
name = "vertex-swarm-net-pullsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Swarm pullsync protocol for storer range synchronisation"

[dependencies]
## vertex
vertex-net-codec.workspace = true
vertex-swarm-net-headers.workspace = true
vertex-swarm-net-proto.workspace = true
vertex-swarm-primitives.workspace = true
nectar-primitives.workspace = true
nectar-postage.workspace = true

## alloy
alloy-primitives.workspace = true

## p2p
libp2p.workspace = true
asynchronous-codec.workspace = true

## protobuf
quick-protobuf.workspace = true
quick-protobuf-codec.workspace = true

## async
futures.workspace = true

## misc
bytes.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true

## test-value generation (feature `arbitrary`)
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
alloy-signer-local.workspace = true
alloy-primitives = { workspace = true, features = ["arbitrary"] }
arbitrary.workspace = true
nectar-primitives = { workspace = true, features = ["arbitrary"] }
nectar-postage = { workspace = true, features = ["arbitrary"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
vertex-swarm-test-utils.workspace = true

[features]
# Valid-by-construction `Arbitrary` impls for the wire types plus the
# fuzz-facing surface (the adversarial offer generator and the bitvector
# invariant check), shared by the proptest suite and the fuzz targets.
# Dev-only: never enabled by a shipped artefact cone.
arbitrary = [
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "nectar-primitives/arbitrary",
    "nectar-postage/arbitrary",
]

[lints]
workspace = true

[package]
name = "vertex-swarm-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Test utilities and mocks for vertex-swarm crates"

[lints]
workspace = true

[dependencies]
# Swarm dependencies
vertex-swarm-api.workspace = true
vertex-swarm-primitives.workspace = true
vertex-swarm-spec.workspace = true
vertex-swarm-identity.workspace = true
vertex-swarm-peer = { workspace = true, features = ["test-utils"] }
nectar-primitives.workspace = true

# Crypto/signing
alloy-primitives.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true

# libp2p (for PeerId generation)
libp2p.workspace = true

# Utilities
rand.workspace = true
parking_lot.workspace = true

# Property-testing strategies (gated by the `proptest` feature)
proptest = { workspace = true, optional = true }
proptest-arbitrary-interop = { workspace = true, optional = true }

# Cluster harness (gated by the `cluster` feature)
vertex-swarm-node = { workspace = true, optional = true }
vertex-swarm-topology = { workspace = true, optional = true }
vertex-tasks = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "sync",
    "rt",
    "macros",
    "time",
    "test-util",
] }
eyre = { workspace = true, optional = true }

# Swarm-test harness (gated by the `harness` feature)
libp2p-swarm-test = { workspace = true, optional = true }
vertex-net-peer-registry = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
# Proptest value strategies for core wire types. Dev-only: enable it from a
# codec crate's dev-dependency on this crate. Never turned on in a shipped cone.
proptest = [
    "dep:proptest",
    "dep:proptest-arbitrary-interop",
    "nectar-primitives/arbitrary",
]
# In-process multi-node cluster harness. Pulls in `vertex-swarm-node` and a
# tokio runtime, so it's gated to keep crate-local tests of leaf primitives
# fast and dependency-light.
cluster = [
    "dep:vertex-swarm-node",
    "dep:vertex-swarm-topology",
    "dep:vertex-tasks",
    "dep:tokio",
    "dep:eyre",
]
# Vertex harness over `libp2p-swarm-test`: seeded identities, connect-and-activate,
# drive helpers, and panic-safe spawning for behaviour-level tests. Dev-only, so
# it is behaviour-agnostic and never enters a shipped cone.
harness = [
    "dep:libp2p-swarm-test",
    "dep:vertex-net-peer-registry",
    "dep:vertex-tasks",
    "dep:tokio",
    "dep:futures",
]

[package]
name = "vertex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
quick-protobuf = "0.8"
vertex-net-codec = { path = "../crates/net/codec" }
vertex-swarm-net-proto = { path = "../crates/swarm/net/proto" }
# The `arbitrary` feature is the shared generator layer: the same
# valid-by-construction impls drive the stable proptest suites, and they
# plumb the nectar `arbitrary` features through the parent workspace's
# git pin so the fuzz lock resolves one copy of the nectar types.
vertex-swarm-net-pushsync = { path = "../crates/swarm/net/pushsync", features = [
	"arbitrary",
] }
vertex-swarm-net-handshake = { path = "../crates/swarm/net/handshake", features = [
	"arbitrary",
] }
vertex-swarm-peer = { path = "../crates/swarm/peers/peer", features = [
	"arbitrary",
] }
vertex-swarm-net-hive = { path = "../crates/swarm/net/hive", features = [
	"arbitrary",
] }
vertex-swarm-net-identify = { path = "../crates/swarm/net/identify", features = [
	"arbitrary",
] }
vertex-swarm-net-pullsync = { path = "../crates/swarm/net/pullsync", features = [
	"arbitrary",
] }

[[bin]]
name = "pushsync_decode"
path = "fuzz_targets/pushsync_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pushsync_roundtrip"
path = "fuzz_targets/pushsync_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_decode"
path = "fuzz_targets/handshake_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_uvarint_differential"
path = "fuzz_targets/handshake_uvarint_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_roundtrip"
path = "fuzz_targets/handshake_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "swarm_peer_parse"
path = "fuzz_targets/swarm_peer_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "swarm_peer_roundtrip"
path = "fuzz_targets/swarm_peer_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hive_decode"
path = "fuzz_targets/hive_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identify_decode"
path = "fuzz_targets/identify_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pullsync_decode"
path = "fuzz_targets/pullsync_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pullsync_bitvector"
path = "fuzz_targets/pullsync_bitvector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pullsync_roundtrip"
path = "fuzz_targets/pullsync_roundtrip.rs"
test = false
doc = false
bench = false

# Make arithmetic overflow and debug_assert! act as fuzz oracles even in the
# optimized builds cargo-fuzz produces.
[profile.release]
overflow-checks = true
debug-assertions = true

# Self-contained workspace root: keeps the parent workspace from ever trying
# to build the nightly-only fuzz crate.
[workspace]
resolver = "2"
